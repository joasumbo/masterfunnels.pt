services:
  - type: web
    name: masterfunnels-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SEGREDO
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MODELO_CLASSIFICACAO
        value: gemini-2.5-flash
      - key: MODELO_AGENTE
        value: gemini-2.5-flash
